# Render Blueprint: creates the web service and the PostgreSQL database in one click.
databases:
  - name: zcbs-db
    plan: free
    databaseName: zcbs
    user: zcbs
services:
  - type: web
    name: zcbs-website
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zcbs-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false
      - key: ADMIN_URL
        value: admin/
