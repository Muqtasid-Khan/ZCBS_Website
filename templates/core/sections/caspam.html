<section class="section caspam-band">
  <span class="caspam-sym" aria-hidden="true">∑</span>
  <div class="container"><div class="row align-items-center g-5">
    <div class="col-lg-5 reveal">
      <span class="eyebrow">{{ section.eyebrow }}</span><h2>{{ section.heading }}</h2><span class="rule"></span>
      <p class="lead-text">{{ section.body }}</p>
      <div class="caspam-actions">
        {% if section.button_label %}<a class="link-arrow" href="{{ section.button_url }}"{% if section.button_url|slice:":4" == "http" %} target="_blank" rel="noopener"{% endif %}>{{ section.button_label }}</a>{% endif %}
        {% if section.button2_label %}<a class="link-arrow" href="{{ section.button2_url }}"{% if section.button2_url|slice:":4" == "http" %} target="_blank" rel="noopener"{% endif %}>{{ section.button2_label }}</a>{% endif %}
      </div>
    </div>
    <div class="col-lg-7 reveal">
      {% if section.image %}<figure class="caspam-frame"><img src="{{ section.image.url }}" alt="{{ section.heading }}" loading="lazy"></figure>{% endif %}
    </div>
  </div></div>
</section>
