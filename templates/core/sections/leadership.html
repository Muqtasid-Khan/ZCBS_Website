{% if leadership %}
<section class="section"><div class="container">
  <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4 reveal">
    <div><span class="eyebrow">{{ section.eyebrow }}</span><h2 class="mb-0">{{ section.heading }}</h2></div>
    {% if section.button_label %}<a class="link-arrow" href="{{ section.button_url }}">{{ section.button_label }}</a>{% endif %}
  </div>
  <div class="row g-4 justify-content-center">{% for m in leadership %}<div class="col-6 col-md-4 col-lg-3 reveal">{% include "partials/member_card.html" with lead=True %}</div>{% endfor %}</div>
</div></section>{% endif %}
