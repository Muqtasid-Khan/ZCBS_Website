{% if site.socials %}
<section class="section alt"><div class="container text-center reveal">
  <span class="eyebrow">{{ section.eyebrow }}</span><h2>{{ section.heading }}</h2><span class="rule center"></span>
  <div class="mt-3">{% for s in site.socials %}<a class="btn btn-outline-navy m-1" href="{{ s.url }}" target="_blank" rel="noopener"><i class="bi {{ s.icon }} me-2"></i>{{ s.name|title }}</a>{% endfor %}</div>
</div></section>{% endif %}
