{% load static %}
<section class="hero" aria-labelledby="hero-h">
  {% if section.image %}<div class="hero-bgimg" style="background-image:url('{{ section.image.url }}')"></div>{% endif %}
  <div class="hero-arches" aria-hidden="true"></div>
  <div class="container">
    <div class="row align-items-center g-5">
      <div class="col-lg-7">
        <span class="eyebrow reveal-hero">{{ section.eyebrow }}</span>
        <h1 id="hero-h" class="reveal-hero">{{ section.heading }}</h1>
        <p class="lead reveal-hero">{{ section.body }}</p>
        <div class="d-flex flex-wrap gap-3 mt-4 reveal-hero">
          {% if section.button_label %}<a class="btn btn-gold" href="{{ section.button_url }}">{{ section.button_label }}</a>{% endif %}
          <a class="btn btn-outline-gold" href="/events/">Explore events</a>
        </div>
      </div>
      <div class="col-lg-5 text-center d-none d-lg-block reveal-hero"><img class="hero-emblem" src="{% static 'brand/zcbs-emblem.svg' %}" alt=""></div>
    </div>
  </div>
  <a class="hero-scroll" href="#after-hero" aria-label="Scroll down"><i class="bi bi-chevron-double-down"></i></a>
</section>
<span id="after-hero"></span>
