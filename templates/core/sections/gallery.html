{% if gallery_items %}
<section class="section alt"><div class="container">
  <div class="d-flex justify-content-between align-items-end flex-wrap gap-3 mb-4 reveal">
    <div><span class="eyebrow">{{ section.eyebrow }}</span><h2 class="mb-0">{{ section.heading }}</h2></div>
    {% if section.button_label %}<a class="link-arrow" href="{{ section.button_url }}">{{ section.button_label }}</a>{% endif %}
  </div>
  <div class="masonry reveal">{% for m in gallery_items %}<a href="{{ m.image.url }}" data-lightbox data-caption="{{ m.caption }}"><img src="{{ m.image.url }}" alt="{{ m.caption|default:'ZCBS photograph' }}" loading="lazy"></a>{% endfor %}</div>
</div></section>{% endif %}
